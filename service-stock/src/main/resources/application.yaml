server:
  port: 8083

spring:
  application:
    name: service-stock
  datasource:
    url: jdbc:postgresql://localhost:5443/db_stock
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka
      instance:
        instance-id: ${spring.application.name}:${server.port}