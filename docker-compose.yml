services:
  postgres-utilisateurs:
    image: postgres:16
    container_name: postgres-utilisateurs
    environment:
      POSTGRES_DB: db_utilisateurs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"
    volumes:
      - pgdata_utilisateurs:/var/lib/postgresql/data

  postgres-catalogue:
    image: postgres:16
    container_name: postgres-catalogue
    environment:
      POSTGRES_DB: db_catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - pgdata_catalogue:/var/lib/postgresql/data

  postgres-stock:
    image: postgres:16
    container_name: postgres-stock
    environment:
      POSTGRES_DB: db_stock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5443:5432"
    volumes:
      - pgdata_stock:/var/lib/postgresql/data

  postgres-commande:
    image: postgres:16
    container_name: postgres-commande
    environment:
      POSTGRES_DB: db_commande
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5444:5432"
    volumes:
      - pgdata_commande:/var/lib/postgresql/data

volumes:
  pgdata_utilisateurs:
  pgdata_catalogue:
  pgdata_stock:
  pgdata_commande: